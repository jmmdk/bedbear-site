><rect x="-21" y="-3" width="42" height="9" rx="4.5" fill="#DDE4F7"/><circle cx="32" cy="-10" r="5.5" fill="#F5F0E6"/></g><style>@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}@keyframes sweat{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}@keyframes spark{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}.breathe{transform-origin:50% 90%;animation:breathe 4.2s ease-in-out infinite}.zz{animation:zz 3.2s ease-in-out infinite}.sweat{animation:sweat 1.2s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>